<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanu Juely Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <div class="logo">Tanu Juely Shop</div>
        <div class="nav-right">
            <select id="lang-switch" onchange="switchLanguage()">
                <option value="en">English</option>
                <option value="hi">Hindi (हिंदी)</option>
            </select>
            <a href="admin/index.html" class="admin-btn">Admin Login</a>
        </div>
    </header>

    <section class="controls">
        <input type="text" id="search-bar" placeholder="Search products..." onkeyup="searchProducts()">
        <select id="category-filter" onchange="filterCategory()">
            <option value="all">All Categories</option>
            <option value="Kurti">Kurti</option>
            <option value="Saree">Saree</option>
            <option value="Tops">Tops</option>
        </select>
    </section>

    <main id="product-container" class="product-grid">
        </main>

    <div id="order-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeOrderModal()">&times;</span>
            <h3 id="form-title">Checkout Details</h3>
            <form id="order-form" onsubmit="submitOrder(event)">
                <input type="hidden" id="order-product-id">
                <input type="text" id="cust-name" placeholder="Full Name *" required>
                <input type="tel" id="cust-phone" placeholder="Mobile Number *" required>
                <input type="text" id="cust-address" placeholder="Complete Address *" required>
                <input type="text" id="cust-city" placeholder="City *" required>
                <input type="text" id="cust-pincode" placeholder="Pincode *" required>
                
                <label>Size:</label>
                <select id="cust-size">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>

                <button type="submit" class="submit-order-btn">Confirm Order (WhatsApp)</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
