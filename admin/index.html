<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tanu Juely Shop</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .admin-container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .hidden { display: none; }
        .order-card { border-left: 5px solid #e91e63; background: #fff5f7; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .status-select { width: auto; display: inline-block; padding: 5px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="login-box" class="admin-container">
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="admin-email" value="tanujuelyshop@gmail.com" readonly>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-password" placeholder="Enter password">
        </div>
        <button onclick="loginAdmin()">Login</button>
    </div>

    <div id="dashboard" class="admin-container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Tanu Juely Shop - Admin Panel</h2>
            <button onclick="logoutAdmin()" style="width: auto; background: #333;">Logout</button>
        </div>

        <hr>

        <h3>🎁 Add New Product</h3>
        <form id="product-form" onsubmit="addProduct(event)">
            <div class="form-group">
                <label>Product Name *</label>
                <input type="text" id="prod-name" required>
            </div>
            <div class="form-group">
                <label>Price (₹) *</label>
                <input type="number" id="prod-price" required>
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select id="prod-category">
                    <option value="Kurti">Kurti</option>
                    <option value="Saree">Saree</option>
                    <option value="Tops">Tops</option>
                    <option value="Gowns">Gowns</option>
                </select>
            </div>
            <div class="form-group">
                <label>Image URL (Photo Link) *</label>
                <input type="url" id="prod-image" placeholder="https://example.com/photo.jpg" required>
            </div>
            <div class="form-group">
                <label>Badge</label>
                <select id="prod-badge">
                    <option value="New Arrival">New Arrival</option>
                    <option value="Best Seller">Best Seller</option>
                    <option value="None">None</option>
                </select>
            </div>
            <div class="form-group">
                <label>Stock Status</label>
                <select id="prod-stock">
                    <option value="In Stock">In Stock</option>
                    <option value="Out of Stock">Out of Stock</option>
                </select>
            </div>
            <button type="submit">Upload Product</button>
        </form>

        <hr>

        <h3>📦 Customer Orders (Database)</h3>
        <div id="orders-list">
            </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
